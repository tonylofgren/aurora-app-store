name: Validate app submission
on:
  issues:
    types: [opened, edited]

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'submission:pending')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        id: parse
        with:
          script: |
            const body = context.payload.issue.body || "";
            function read(h){ const m = body.match(new RegExp(`(?<=### ${h}\\n)[\\s\\S]*?(?=\\n###|$)`)); return m?m[0].trim():""; }
            const repoUrl = read('Repository URL');
            core.setOutput('repo', repoUrl);

      - name: Validate repository
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const repoUrl = '${{ steps.parse.outputs.repo }}';
            const m = repoUrl.match(/^https:\/\/github\.com\/([^\/]+)\/([^\/]+)$/);
            if(!m){ core.setFailed('Invalid repo URL'); return; }
            const owner = m[1], repo = m[2];

            const { data: r } = await github.rest.repos.get({ owner, repo });
            const { data: t } = await github.rest.repos.getAllTopics({ owner, repo });
            const hasTopic = (t.names || []).includes('aurora-app');

            let hasRelease = false;
            try {
              const { data: rel } = await github.rest.repos.listReleases({ owner, repo, per_page: 1 });
              hasRelease = (rel.length > 0);
            } catch(e) { hasRelease = false; }

            let hasManifest = false;
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: 'aurora-manifest.json', ref: r.default_branch
              });
              hasManifest = !!file;
            } catch(e) { hasManifest = false; }

            return { repo: repoUrl, hasTopic, hasRelease, hasManifest };
          result-encoding: string

      - name: Comment result
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const res = JSON.parse(process.env.RESULT);
            const ok = res.hasTopic && res.hasRelease && res.hasManifest;
            const lines = [
              'Validation results:',
              `- topic: ${res.hasTopic?'✅':'❌'}`,
              `- release: ${res.hasRelease?'✅':'❌'}`,
              `- aurora-manifest.json: ${res.hasManifest?'✅':'❌'}`
            ];
            const tail = ok
              ? '\nLabel **submission:approved** to add this app.'
              : '\nLabel **submission:changes-requested** to ask the developer for fixes.';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: lines.join('\n') + tail
            });
        env:
          RESULT: ${{ steps.validate.outputs.result }}
