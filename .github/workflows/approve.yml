name: Approve app
on:
  issues:
    types: [labeled]

jobs:
  approve:
    if: github.event.label.name == 'submission:approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        id: parse
        with:
          script: |
            const body = context.payload.issue.body || "";
            const m = body.match(/https:\/\/github\.com\/[^\s]+\/[^\s]+/);
            if(!m) core.setFailed('Repo URL not found in issue');
            core.setOutput('repo', m ? m[0] : '');

      - name: Add to default-repos.json
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          branch="approve-$(date +%s)"
          git switch -c "$branch"
          tmp=$(mktemp)
          jq --arg r '${{ steps.parse.outputs.repo }}' \
             '(.repos += [$r]) | .repos |= unique | .version = (.version // 1)' \
             default-repos.json > "$tmp"
          mv "$tmp" default-repos.json
          git add default-repos.json
          git -c user.name="automation" -c user.email="bot@users.noreply.github.com" commit -m "Approve: add ${{ steps.parse.outputs.repo }}"
          git push -u origin "$branch"

      - name: Open PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.create({
              ...context.repo,
              title: `Approve app: add to default list`,
              head: process.env.GITHUB_REF_NAME,
              base: 'main',
              body: `Adds ${{ steps.parse.outputs.repo }} to default-repos.json.`
            })
