name: Remove app
on:
  issues:
    types: [labeled]

jobs:
  remove:
    if: github.event.label.name == 'submission:remove'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Parse repo URL from issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const m = body.match(/https:\/\/github\.com\/[^\s]+\/[^\s]+/);
            if(!m) core.setFailed('Repo URL not found in issue');
            core.setOutput('repo', m ? m[0] : '');

      - name: Update default-repos.json (mark as removed)
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REPO='${{ steps.parse.outputs.repo }}'

          if [ ! -f default-repos.json ]; then
            echo "default-repos.json not found"; exit 1
          fi

          # Markera som removed (behåll metadata). Alternativ: ta bort helt (se kommenterad rad).
          jq --arg repo "$REPO" --arg now "$NOW" '
            .last_updated = $now |
            .apps = (
              .apps
              | map(if .repository == $repo
                    then .status = "removed" | .removed_at = $now
                    else .
                    end)
            )
            # HÅRDDÖR: avkommentera nästa rad om du vill ta bort helt
            # | .apps = (.apps | map(select(.repository != $repo)))
          ' default-repos.json > default-repos.json.new

          mv default-repos.json.new default-repos.json

      - name: Open PR
        run: |
          BR="remove-$(date +%s)"
          git switch -c "$BR"
          git add default-repos.json
          git -c user.name="automation" -c user.email="bot@users.noreply.github.com" commit -m "Remove: mark ${{ steps.parse.outputs.repo }} as removed"
          git push -u origin "$BR"
          gh pr create --title "Remove app: ${{ steps.parse.outputs.repo }}" --body "Marks app as removed in default-repos.json" --base main
        env:
          GH_TOKEN: ${{ github.token }}
